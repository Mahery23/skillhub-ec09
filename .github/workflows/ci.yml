name: CI/CD — SkillHub

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Spring Boot : build + test + sonar
  # ─────────────────────────────────────────
  auth-service:
    name: Auth Service — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install, Test, Coverage
        working-directory: auth-service
        env:
          APP_MASTER_KEY: test_master_key_for_ci_only_32chars
        run: mvn verify -B

      - name: SonarCloud — Auth Service
        working-directory: auth-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          APP_MASTER_KEY: test_master_key_for_ci_only_32chars
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Mahery23_skillhub-ec09 \
            -Dsonar.organization=mahery23 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} -B

  # ─────────────────────────────────────────
  # JOB 2 — Laravel + React : lint + test + sonar
  # ─────────────────────────────────────────
  ci:
    name: Laravel + React — Lint · Test · Sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, zip, bcmath, gd, mongodb-2.2.0
          coverage: pcov

      - name: Install — Composer
        working-directory: ./backend
        run: |
          mkdir -p bootstrap/cache storage/logs \
                   storage/framework/{cache,sessions,views}
          composer install --no-interaction --optimize-autoloader \
                           --ignore-platform-req=ext-mongodb

      - name: Lint — PHP CS
        working-directory: ./backend
        run: ./vendor/bin/phpcs --standard=PSR12 app/ || true

      - name: Test — Laravel
        working-directory: ./backend
        env:
          APP_ENV: testing
          APP_KEY: base64:dGVzdGluZ19rZXlfMzJfYnl0ZXNfZm9yX3BocHVuaXRfMjAyNg==
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_FOREIGN_KEYS: "false"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_SERVICE_URL: http://localhost:8080
        run: php artisan test --coverage-clover=coverage.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install — npm
        working-directory: ./frontend
        run: npm ci

      - name: Lint — ESLint
        working-directory: ./frontend
        run: npm run lint || true

      - name: Test — React
        working-directory: ./frontend
        run: npm run test:coverage

      - name: SonarCloud — Laravel + React
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}